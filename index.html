<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIMS · RISE 성과관리시스템</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/tabler-icons.min.css">
<style>
:root{
  --bg:#f1f5fb;--sf:#fff;--sf2:#f8f9fc;
  --tx:#1a1d2e;--tx2:#6b7280;--tx3:#b0b7c3;
  --bd:#e5e7eb;--bd2:#d1d5db;
  --pr:#1a6fc4;--pr-h:#1460aa;--pr-l:#dbeafe;
  --gn:#0f6e56;--gn-l:#d1fae5;
  --or:#92400e;--or-l:#fef3c7;
  --pu:#4338ca;--pu-l:#ede9fe;
  --rd:#b91c1c;--rd-l:#fee2e2;
  --r-md:8px;--r-lg:12px;--r-xl:18px;
  --sh:0 8px 32px rgba(0,0,0,.14);
  --fn:-apple-system,BlinkMacSystemFont,'Pretendard','Noto Sans KR',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--fn);background:var(--bg);color:var(--tx);min-height:100vh;font-size:14px}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:3px}
/* LOGIN */
#LS{position:fixed;inset:0;background:linear-gradient(135deg,#0f2d4f,#1a6fc4 50%,#0f6e56);display:flex;align-items:center;justify-content:center;z-index:9000}
.lb{background:#fff;border-radius:var(--r-xl);padding:44px 40px;width:400px;max-width:95vw;box-shadow:var(--sh)}
.ll{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#1a6fc4,#0f6e56);display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;font-weight:700;margin:0 auto 16px}
.lt{text-align:center;font-size:22px;font-weight:700;margin-bottom:4px}
.ls{text-align:center;font-size:13px;color:var(--tx2);margin-bottom:28px;line-height:1.6}
.lf{margin-bottom:14px}
.lf label{display:block;font-size:13px;font-weight:500;color:var(--tx2);margin-bottom:5px}
.lf input{width:100%;padding:11px 13px;border:1.5px solid var(--bd2);border-radius:var(--r-md);font-size:14px;font-family:var(--fn);color:var(--tx)}
.lf input:focus{outline:none;border-color:var(--pr);box-shadow:0 0 0 3px var(--pr-l)}
.lbtn{width:100%;padding:12px;background:var(--pr);color:#fff;border:none;border-radius:var(--r-md);font-size:15px;font-weight:600;font-family:var(--fn);cursor:pointer}
.lbtn:hover{background:var(--pr-h)}
#LE{color:var(--rd);font-size:13px;text-align:center;margin-top:10px;min-height:20px}
.lh{font-size:12px;color:var(--tx3);text-align:center;margin-top:16px;line-height:1.7}
/* TOPBAR */
.topbar{position:sticky;top:0;z-index:100;background:var(--sf);border-bottom:1.5px solid var(--bd);padding:0 28px;display:flex;align-items:center;justify-content:space-between;height:56px;box-shadow:0 1px 6px rgba(0,0,0,.07)}
.tb-brand{display:flex;align-items:center;gap:11px}
.tb-logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#1a6fc4,#0f6e56);display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;font-weight:700}
.tb-name{font-size:15px;font-weight:700}
.tb-r{display:flex;align-items:center;gap:12px}
.uc{display:flex;align-items:center;gap:8px;padding:6px 13px;background:var(--sf2);border:1.5px solid var(--bd);border-radius:22px;font-size:13px;cursor:pointer}
.uav{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
.rb{padding:2px 8px;border-radius:10px;font-size:12px;font-weight:500}
.rb-m{background:#fef3c7;color:#92400e}
.rb-p{background:var(--pu-l);color:#3730a3}
.rb-s{background:var(--pr-l);color:#1e3a8a}
/* MAIN */
.main{max-width:1300px;margin:0 auto;padding:22px 28px 70px}
/* NAV */
.nav{display:flex;gap:2px;border-bottom:2px solid var(--bd);margin-bottom:1.4rem;overflow-x:auto}
.nb{padding:11px 18px;background:none;border:none;border-bottom:3px solid transparent;margin-bottom:-2px;cursor:pointer;font-size:14.5px;color:var(--tx2);font-family:var(--fn);white-space:nowrap}
.nb:hover{color:var(--tx)}
.nb.on{color:var(--pr);border-bottom-color:var(--pr);font-weight:600}
.snav{display:flex;gap:6px;margin-bottom:14px}
.snb{padding:7px 16px;border:1.5px solid var(--bd2);border-radius:22px;background:none;cursor:pointer;font-size:13.5px;color:var(--tx2);font-family:var(--fn)}
.snb.on{background:var(--pr);color:#fff;border-color:var(--pr)}
/* KPI */
.kr{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:1.2rem}
@media(max-width:640px){.kr{grid-template-columns:repeat(2,1fr)}}
.kp{background:var(--sf);border-radius:var(--r-lg);padding:16px 18px;border:1.5px solid var(--bd)}
.kv{font-size:28px;font-weight:700;margin-bottom:3px}
.kl{font-size:13.5px;color:var(--tx2)}
/* TOOLBAR */
.tb{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px;gap:8px;flex-wrap:wrap}
.fr{display:flex;gap:5px;flex-wrap:wrap}
.fb{padding:7px 14px;border:1.5px solid var(--bd2);border-radius:22px;background:none;cursor:pointer;font-size:13px;color:var(--tx2);font-family:var(--fn)}
.fb:hover{border-color:var(--pr);color:var(--pr)}
.fb.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.btn{padding:9px 18px;border:none;border-radius:var(--r-md);cursor:pointer;font-size:14px;font-family:var(--fn);display:inline-flex;align-items:center;gap:5px;font-weight:600}
.bp{background:var(--pr);color:#fff}
.bp:hover{background:var(--pr-h)}
.bs{padding:5px 12px;font-size:13px}
.bo{background:none;border:1.5px solid var(--bd2);color:var(--tx2)}
.bo:hover{border-color:var(--pr);color:var(--pr);background:var(--pr-l)}
/* CARD */
.sc{background:var(--sf);border:1.5px solid var(--bd);border-radius:var(--r-lg);margin-bottom:1.1rem}
.sc.ov{overflow:hidden}
.sch{display:flex;justify-content:space-between;align-items:center;padding:13px 17px;border-bottom:1.5px solid var(--bd)}
.sct{font-size:15px;font-weight:600}
/* TABLE */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{padding:11px 12px;border-bottom:1.5px solid var(--bd);color:var(--tx2);font-weight:600;font-size:13px;text-align:left;background:var(--sf2);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--bd);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:#fafbff}
/* BADGE */
.badge{display:inline-block;padding:4px 10px;border-radius:10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.bd{background:#dcfce7;color:#166534}.bi{background:var(--pr-l);color:#1e3a8a}
.bl{background:var(--rd-l);color:var(--rd)}.bp2{background:var(--or-l);color:var(--or)}
.bq{background:var(--pu-l);color:#3730a3}.bql{background:var(--gn-l);color:#065f46}
.ba{background:#f1f5f9;color:#475569}
/* ACTION BUTTONS - 항상 선명하게 보임 */
.aw{display:flex;gap:6px;align-items:center}
.ae{width:34px;height:34px;border-radius:8px;background:#dbeafe;color:#1d4ed8;border:1.5px solid #93c5fd;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.ae:hover{background:#1d4ed8;color:#fff;border-color:#1d4ed8}
.ad{width:34px;height:34px;border-radius:8px;background:#fee2e2;color:#b91c1c;border:1.5px solid #fca5a5;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.ad:hover{background:#b91c1c;color:#fff;border-color:#b91c1c}
.ag{width:34px;height:34px;border-radius:8px;background:#d1fae5;color:#065f46;border:1.5px solid #6ee7b7;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.ag:hover{background:#065f46;color:#fff}
.ai{height:34px;padding:0 14px;border-radius:8px;background:#dbeafe;color:#1d4ed8;border:1.5px solid #93c5fd;cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;font-family:var(--fn);white-space:nowrap}
.ai:hover{background:#1d4ed8;color:#fff}
/* PROGRESS */
.pw{display:flex;align-items:center;gap:7px}
.pb{flex:1;height:7px;background:var(--bd);border-radius:4px;overflow:hidden}
.pf{height:100%;border-radius:4px}
.pt{font-size:13px;color:var(--tx2);min-width:34px;text-align:right;font-weight:500}
.mb{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin:4px 0}
.mbf{height:100%;border-radius:3px}
/* BUDGET SPLIT */
.bsp{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:1.2rem}
@media(max-width:640px){.bsp{grid-template-columns:1fr}}
.bsc{border-radius:var(--r-lg);border:1.5px solid var(--bd);overflow:hidden}
.bsm{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:14px 16px}
.bsmv{font-size:17px;font-weight:700;text-align:center}
.bsml{font-size:12px;color:var(--tx2);text-align:center;margin-top:2px}
/* CALENDAR */
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.ch{padding:7px;text-align:center;font-size:12.5px;font-weight:600;color:var(--tx2)}
.cc{min-height:82px;padding:6px;border:1.5px solid var(--bd);border-radius:6px;background:var(--sf)}
.cc.ot{background:var(--sf2);opacity:.5}
.cc.td{border-color:var(--pr);border-width:2px}
.cdn{font-size:12.5px;color:var(--tx2);margin-bottom:4px}
.cdn.td{color:var(--pr);font-weight:700}
.cdot{font-size:11.5px;padding:2px 5px;border-radius:4px;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* WEEK */
.wn{display:flex;align-items:center;gap:12px;background:var(--sf);border-radius:var(--r-lg);padding:12px 18px;margin-bottom:1.1rem;border:1.5px solid var(--bd)}
.wl{flex:1;text-align:center;font-size:15px;font-weight:600}
.wnb{background:none;border:1.5px solid var(--bd2);border-radius:7px;cursor:pointer;padding:6px 14px;font-size:13.5px;color:var(--tx2);font-family:var(--fn)}
.wnb:hover{border-color:var(--pr);color:var(--pr)}
.wd{border:1.5px solid var(--bd);border-radius:var(--r-lg);margin-bottom:8px;overflow:hidden;background:var(--sf)}
.wdh{padding:9px 16px;display:flex;justify-content:space-between;align-items:center;background:var(--sf2)}
.wi{display:flex;align-items:center;gap:9px;padding:9px 16px;border-top:1px solid var(--bd);font-size:13.5px}
.wdt{width:8px;height:8px;border-radius:50%;flex-shrink:0}
/* WEEKLY REPORT */
.wu{border:1.5px solid var(--bd);border-radius:var(--r-lg);overflow:hidden;margin-bottom:.9rem;background:var(--sf)}
.wuh{padding:11px 17px;border-bottom:1.5px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.wub{display:flex;padding:13px 17px;gap:0}
.wuhf{flex:1;min-width:0}
.wuht{font-size:13px;font-weight:600;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.wui{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--bd);align-items:flex-start}
.wui:last-child{border-bottom:none}
.wud{width:1.5px;background:var(--bd);margin:0 14px;align-self:stretch}
.wue{font-size:13px;color:var(--tx3);font-style:italic;padding:10px 0}
/* REPORT STATUS */
.rsd{background:#dcfce7;color:#166534}
.rsi{background:var(--pr-l);color:#1e3a8a}
.rsf{background:var(--or-l);color:var(--or)}
/* DELAY */
.dtag{display:inline-block;font-size:12px;color:var(--rd);background:var(--rd-l);border-radius:4px;padding:2px 7px;margin-top:4px}
/* PERM HINT */
.ph{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--or);background:var(--or-l);padding:6px 12px;border-radius:7px}
/* TOAST */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(80px);background:#1a1d2e;color:#fff;padding:11px 24px;border-radius:12px;font-size:14px;z-index:9999;transition:transform .3s;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}
/* MODAL */
.mbg{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:1000;align-items:center;justify-content:center}
.mbg.on{display:flex}
.modal{background:var(--sf);border-radius:var(--r-xl);width:520px;max-width:97vw;border:1.5px solid var(--bd2);max-height:93vh;overflow-y:auto;box-shadow:var(--sh)}
.mhd{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1.5px solid var(--bd);position:sticky;top:0;background:var(--sf);z-index:1}
.mhd span{font-size:15px;font-weight:700}
.mhd button{background:none;border:none;cursor:pointer;font-size:22px;color:var(--tx2);line-height:1}
.mbd{padding:18px 20px}
.mft{padding:13px 20px;border-top:1.5px solid var(--bd);display:flex;justify-content:flex-end;gap:9px;position:sticky;bottom:0;background:var(--sf)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.fgf{grid-column:1/-1}
.fl{font-size:13px;color:var(--tx2);margin-bottom:5px;display:block;font-weight:500}
.fi{width:100%;padding:9px 12px;border:1.5px solid var(--bd2);border-radius:var(--r-md);font-size:14px;font-family:var(--fn);background:var(--sf2);color:var(--tx)}
.fi:focus{outline:none;border-color:var(--pr);box-shadow:0 0 0 3px var(--pr-l);background:var(--sf)}
.mcx{padding:9px 16px;background:var(--sf2);border:1.5px solid var(--bd2);border-radius:var(--r-md);cursor:pointer;font-size:14px;font-family:var(--fn);color:var(--tx2)}
.mok{padding:9px 20px;background:var(--pr);border:none;border-radius:var(--r-md);cursor:pointer;font-size:14px;font-family:var(--fn);color:#fff;font-weight:600}
.mok:hover{background:var(--pr-h)}
/* FILE */
.fdrop{border:2px dashed var(--bd2);border-radius:var(--r-md);padding:20px;text-align:center;cursor:pointer;background:var(--sf2)}
.fdrop:hover{border-color:var(--pr);background:var(--pr-l)}
.fdrop input{display:none}
.flist{margin-top:9px;display:flex;flex-direction:column;gap:6px}
.fitem{display:flex;align-items:center;gap:9px;padding:8px 11px;background:var(--sf2);border:1.5px solid var(--bd);border-radius:7px;font-size:13px}
/* USER CARD */
.ucard{display:flex;align-items:center;gap:14px;padding:14px 17px;border:1.5px solid var(--bd);border-radius:var(--r-md);margin-bottom:9px;background:var(--sf)}
.uav2{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;flex-shrink:0}
/* DROPDOWN */
.dd{position:relative;display:inline-block}
.ddm{display:none;position:absolute;right:0;top:calc(100%+7px);background:var(--sf);border:1.5px solid var(--bd2);border-radius:var(--r-md);box-shadow:var(--sh);min-width:170px;z-index:500}
.ddm.show{display:block}
.dmi{display:flex;align-items:center;gap:9px;padding:10px 16px;font-size:13.5px;cursor:pointer;color:var(--tx)}
.dmi:hover{background:var(--sf2)}
.dmi.dng{color:var(--rd)}
.dmi.dng:hover{background:var(--rd-l)}
.dms{height:1px;background:var(--bd);margin:4px 0}
</style>
</head>
<body>
<!-- LOGIN -->
<div id="LS">
  <div class="lb">
    <div class="ll">A</div>
    <div class="lt">AIMS</div>
    <div class="ls">RISE 미래인재개발팀 성과관리시스템<br>인천대학교</div>
    <div class="lf"><label>아이디</label><input type="text" id="LID" placeholder="아이디 입력" onkeydown="if(event.key==='Enter')login()"></div>
    <div class="lf"><label>비밀번호</label><input type="password" id="LPW" placeholder="비밀번호 입력" onkeydown="if(event.key==='Enter')login()"></div>
    <button class="lbtn" onclick="login()">로그인</button>
    <div id="LE"></div>
    <div class="lh">기본 마스터 계정: <strong>admin</strong> / <strong>rise2026!</strong></div>
  </div>
</div>
<!-- TOPBAR -->
<div class="topbar" id="TB" style="display:none">
  <div class="tb-brand"><div class="tb-logo">A</div><div><div class="tb-name">AIMS · RISE 성과관리시스템</div></div></div>
  <div class="tb-r">
    <div id="DL" style="font-size:13px;color:var(--tx2)"></div>
    <div class="dd">
      <div class="uc" onclick="toggleDD()">
        <div class="uav" id="UAV"></div><span id="UNM"></span><span class="rb" id="URB"></span>
        <i class="ti ti-chevron-down" style="font-size:12px;color:var(--tx3)"></i>
      </div>
      <div class="ddm" id="DDM">
        <div class="dmi" onclick="closeDD();openMP()"><i class="ti ti-user"></i> 내 정보</div>
        <div class="dmi" id="ABTN" onclick="closeDD();openAdmin()" style="display:none"><i class="ti ti-shield"></i> 사용자 관리</div>
        <div class="dms"></div>
        <div class="dmi dng" onclick="logout()"><i class="ti ti-logout"></i> 로그아웃</div>
      </div>
    </div>
  </div>
</div>
<!-- MAIN -->
<div class="main" id="APP" style="display:none">
  <div class="nav">
    <button class="nb on" onclick="go('task')"><i class="ti ti-clipboard-list"></i> 업무추진</button>
    <button class="nb" onclick="go('ind')"><i class="ti ti-target"></i> 성과지표</button>
    <button class="nb" onclick="go('bud')"><i class="ti ti-coin"></i> 예산관리</button>
    <button class="nb" onclick="go('per')"><i class="ti ti-folder"></i> 개인업무</button>
    <button class="nb" onclick="go('sch')"><i class="ti ti-calendar"></i> 사업일정</button>
    <button class="nb" onclick="go('rpt')"><i class="ti ti-chart-bar"></i> 실적보고</button>
  </div>
  <div id="t-task"></div><div id="t-ind" style="display:none"></div>
  <div id="t-bud" style="display:none"></div><div id="t-per" style="display:none"></div>
  <div id="t-sch" style="display:none"></div><div id="t-rpt" style="display:none"></div>
</div>
<div class="toast" id="TOAST"></div>
<!-- TASK MODAL -->
<div class="mbg" id="MT"><div class="modal">
  <div class="mhd"><span id="MTT">업무 추가</span><button onclick="cm('MT')">×</button></div>
  <div class="mbd"><div class="fg">
    <div><label class="fl">단위사업</label><select class="fi" id="t_u" onchange="updI()"><option>1-1</option><option>1-2</option><option>1-3</option><option value="2-1">2-1 AI</option></select></div>
    <div><label class="fl">분야</label><select class="fi" id="t_f"><option>바이오</option><option>반도체</option><option>물류</option><option>스마트모빌리티</option><option>AI</option><option>창업</option><option>공통</option></select></div>
    <div class="fgf"><label class="fl">업무명</label><input class="fi" id="t_ti" placeholder="업무 내용 입력"></div>
    <div><label class="fl">담당자</label><input class="fi" id="t_w" readonly></div>
    <div><label class="fl">마감일</label><input class="fi" id="t_d" type="date"></div>
    <div><label class="fl">상태</label><select class="fi" id="t_s" onchange="togD()"><option>예정</option><option>진행중</option><option>완료</option><option>지연</option></select></div>
    <div><label class="fl">업무구분</label><select class="fi" id="t_tp" onchange="togI()"><option value="일반행정">일반행정</option><option value="정량지표">정량지표</option><option value="정성지표">정성지표</option></select></div>
    <div id="IW" style="display:none"><label class="fl">연계 성과지표</label><select class="fi" id="t_i"><option value="">-- 선택 --</option></select></div>

const UC={'1-1':'#1a6fc4','1-2':'#0f6e56','1-3':'#92400e','2-1':'#4338ca'};
const CC={'인건비':'#1a6fc4','연구활동비':'#0f6e56','교육훈련비':'#4338ca','장비재료비':'#92400e','간접비':'#64748b','기타':'#b45309'};
const DTC={'사업계획안':'#1a6fc4','결과보고':'#0f6e56','일반지출':'#92400e','문서관리':'#4338ca','기타':'#64748b'};
const RTC={'사업단 주간보고':'#1a6fc4','기획처 주간보고':'#0f6e56','TP 월간보고':'#92400e','실적보고서':'#4338ca','기타':'#64748b'};
const RL={'master':'마스터','professor':'교수','staff':'실무진'};
const RC={'master':'rb-m','professor':'rb-p','staff':'rb-s'};
const AB={'master':'#92400e','professor':'#4338ca','staff':'#1a6fc4'};

// USER
const DU=[{id:'admin',name:'관리자',pw:'rise2026!',role:'master',isAdmin:true}];

function sU(u){localStorage.setItem('a_u',JSON.stringify(u));}
if(!localStorage.getItem('a_u'))sU([...DU]);
let CU=null;

function login(){
  const id=document.getElementById('LID').value.trim();
  const pw=document.getElementById('LPW').value;
  const u=gU().find(x=>x.id===id&&x.pw===pw);
  if(!u){document.getElementById('LE').textContent='아이디 또는 비밀번호가 틀렸습니다.';return;}
  CU=u;sessionStorage.setItem('a_s',JSON.stringify(u));
  document.getElementById('LS').style.display='none';
  document.getElementById('TB').style.display='flex';
  document.getElementById('APP').style.display='block';
  document.getElementById('LE').textContent='';
  rUC();go('task');
}
function logout(){
  sessionStorage.removeItem('a_s');CU=null;
  document.getElementById('LS').style.display='flex';
  document.getElementById('TB').style.display='none';
  document.getElementById('APP').style.display='none';
  document.getElementById('LID').value='';document.getElementById('LPW').value='';
}
function rUC(){
  if(!CU)return;
  const av=document.getElementById('UAV');av.style.background=AB[CU.role]||'#1a6fc4';av.textContent=CU.name[0];
  document.getElementById('UNM').textContent=CU.name;
  const rb=document.getElementById('URB');rb.textContent=RL[CU.role];rb.className='rb '+RC[CU.role];
  document.getElementById('ABTN').style.display=CU.role==='master'?'flex':'none';
}
function isAdmin(){return CU&&(CU.role==='master'||CU.isAdmin===true);}
function isMaster(){return CU&&CU.role==='master';}
function toggleDD(){document.getElementById('DDM').classList.toggle('show');}
function closeDD(){document.getElementById('DDM').classList.remove('show');}
document.addEventListener('click',e=>{if(!e.target.closest('.dd'))closeDD();});

function openMP(){
  document.getElementById('MPAv').style.background=AB[CU.role];document.getElementById('MPAv').textContent=CU.name[0];
  document.getElementById('MPNm').textContent=CU.name;
  document.getElementById('MPBg').innerHTML=`<span class="rb ${RC[CU.role]}">${RL[CU.role]}</span>${CU.isAdmin&&CU.role!=='master'?' <span class="badge bi">관리자</span>':''}`;
  document.getElementById('mp_n').value=CU.name;
  ['mp_o','mp_p','mp_p2'].forEach(i=>document.getElementById(i).value='');
  om('MMP');
}
function svMP(){
  const name=document.getElementById('mp_n').value.trim(),old=document.getElementById('mp_o').value,nw=document.getElementById('mp_p').value,nw2=document.getElementById('mp_p2').value;
  if(!name){toast('이름을 입력하세요');return;}
  const users=gU(),idx=users.findIndex(u=>u.id===CU.id);
  if(nw){if(old!==users[idx].pw){toast('현재 비밀번호가 틀립니다','e');return;}if(nw!==nw2){toast('비밀번호가 일치하지 않습니다','e');return;}if(nw.length<6){toast('6자 이상 입력하세요','e');return;}users[idx].pw=nw;}
  users[idx].name=name;sU(users);CU={...users[idx]};sessionStorage.setItem('a_s',JSON.stringify(CU));rUC();cm('MMP');toast('저장되었습니다');
}
function openAdmin(){rAL();om('MAD');}
function rAL(){
  const users=gU();
  document.getElementById('AUL').innerHTML=users.map(u=>`<div class="ucard">
    <div class="uav2" style="background:${AB[u.role]||'#1a6fc4'}">${u.name[0]}</div>
    <div style="flex:1;min-width:0">
      <div style="font-size:14px;font-weight:600">${u.name}${u.id===CU.id?' <span style="font-size:12px;color:var(--tx3)">(나)</span>':''}${u.isAdmin&&u.role!=='master'?' <span class="badge bi" style="font-size:12px">관리자</span>':''}</div>
      <div style="font-size:12.5px;color:var(--tx2);margin-top:2px">@${u.id} · <span class="rb ${RC[u.role]}">${RL[u.role]}</span></div>
    </div>
    <div style="display:flex;gap:7px">
      ${u.role!=='master'&&u.id!==CU.id?`<button class="btn bs ${u.isAdmin?'bo':'bp'}" onclick="tAdmin('${u.id}')">${u.isAdmin?'권한 해제':'권한 부여'}</button>`:''}
      ${u.role!=='master'&&u.id!==CU.id?`<button class="ad" onclick="delU('${u.id}')" title="삭제"><i class="ti ti-trash"></i></button>`:''}
    </div></div>`).join('');
}
function addU(){
  const name=document.getElementById('nu_n').value.trim(),id=document.getElementById('nu_id').value.trim(),pw=document.getElementById('nu_pw').value,role=document.getElementById('nu_r').value;
  if(!name||!id||!pw){toast('모든 항목을 입력하세요','e');return;}
  const users=gU();if(users.find(u=>u.id===id)){toast('이미 존재하는 아이디입니다','e');return;}
  users.push({id,name,pw,role,isAdmin:false});sU(users);
  ['nu_n','nu_id','nu_pw'].forEach(x=>document.getElementById(x).value='');
  rAL();toast(`${name} 계정이 추가되었습니다`);
}
function tAdmin(uid){const users=gU(),idx=users.findIndex(u=>u.id===uid);if(idx<0)return;users[idx].isAdmin=!users[idx].isAdmin;sU(users);rAL();toast(users[idx].isAdmin?'관리자 권한 부여':'관리자 권한 해제');}
function delU(uid){if(!confirm('이 계정을 삭제하시겠습니까?'))return;sU(gU().filter(u=>u.id!==uid));rAL();toast('계정이 삭제되었습니다');}

    {id:'i1_7',unit:'1-1',name:'취업률 (졸업생)',ul:'%',t25:28,a25:9.2,t26:30,a26:0},
    {id:'i2_1',unit:'1-2',name:'캡스톤디자인 이수학생 비율',ul:'%',t25:15,a25:24.4,t26:18,a26:0},

}

  </div>`;
  UNITS.forEach(u=>{
    const uI=indicators.filter(i=>i.unit===u),uB=budget.filter(b=>b.unit===u);
    const uC2=uB.filter(b=>b.btype==='이월'),uN=uB.filter(b=>b.btype==='연차');
    const ca2=uC2.reduce((s,b)=>s+b.al,0),ce2=uC2.reduce((s,b)=>s+b.ex,0);
    const na2=uN.reduce((s,b)=>s+b.al,0),ne2=uN.reduce((s,b)=>s+b.ex,0);
    const ua=ca2+na2,ue=ce2+ne2,ur=pct(ue,ua);
    const uAch=uI.filter(i=>i.t26>0&&i.a26>=i.t26).length,uWith=uI.filter(i=>i.t26>0).length;
    const uT=tasks.filter(t=>t.unit===u),uDone=uT.filter(t=>t.stat==='완료').length,uLate=uT.filter(t=>t.stat==='지연').length;
    const uc2=UC[u];
    h+=`<div class="sc ov">
      <div style="padding:13px 17px;display:flex;justify-content:space-between;align-items:center;background:${uc2}10">
        <div><div style="font-size:15px;font-weight:700;color:${uc2}">${u} · ${UN[u]}</div><div style="font-size:13px;color:var(--tx2);margin-top:3px">과제 ${uT.length}건 · 완료 ${uDone} · 지연 ${uLate}</div></div>
        <div style="display:flex;gap:9px;align-items:center">
          <span style="font-size:13.5px;color:var(--tx2)">지표</span><span class="badge" style="background:${ab(pct(uAch,uWith)||0)};color:${ac(pct(uAch,uWith)||0)}">${uAch}/${uWith}</span>
          <span style="font-size:13.5px;color:var(--tx2)">집행률</span><span class="badge" style="background:${ab(ur)};color:${pc(ur)}">${ur}%</span>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr)">
        ${[['전체 집행률',ur,`${fmt(ue)} / ${fmt(ua)}천원`,pc(ur)],['이월 집행률',pct(ce2,ca2),`${fmt(ce2)} / ${fmt(ca2)}천원`,'#92400e'],['연차 집행률',pct(ne2,na2),`${fmt(ne2)} / ${fmt(na2)}천원`,'#1a6fc4']].map(([l,v,sub,cl])=>`<div style="padding:12px 16px;text-align:center;border-right:1.5px solid var(--bd);border-bottom:1.5px solid var(--bd)"><div style="font-size:22px;font-weight:700;color:${cl}">${v}%</div><div style="font-size:12.5px;color:var(--tx2);margin-top:2px">${l}</div><div class="mb"><div class="mbf" style="width:${Math.min(v,100)}%;background:${cl}"></div></div><div style="font-size:12px;color:var(--tx3)">${sub}</div></div>`).join('')}
      </div>
      <div style="padding:13px 17px">
        <div style="font-size:13.5px;font-weight:600;color:var(--tx2);margin-bottom:10px;padding-bottom:6px;border-bottom:1.5px solid var(--bd)">성과지표 달성 현황</div>
        <table class="tbl" style="margin-bottom:16px"><thead><tr><th>지표명</th><th style="text-align:right;width:75px">목표</th><th style="text-align:right;width:75px">실적</th><th style="text-align:right;width:70px">달성도</th><th style="width:65px">상태</th><th style="width:130px">현황</th></tr></thead><tbody>`;
    uI.forEach(i=>{
      const r=i.t26>0?pct(i.a26,i.t26):null,hd=i.a26>0;
      h+=`<tr><td style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${i.name}</td><td style="text-align:right">${fmt(i.t26)}${i.ul}</td><td style="text-align:right;font-weight:700;color:${hd&&r!==null?ac(r):'var(--tx2)'}">${hd?fmt(i.a26)+i.ul:'-'}</td><td style="text-align:right;font-weight:700;color:${r!==null&&hd?ac(r):'var(--tx2)'}">${r!==null&&hd?r+'%':'-'}</td><td>${r!==null&&hd?`<span class="badge" style="background:${ab(r)};color:${ac(r)}">${r>=100?'달성':r>=80?'근접':'미달'}</span>`:`<span style="font-size:13px;color:var(--tx3)">미입력</span>`}</td><td>${r!==null?`<div class="mb"><div class="mbf" style="width:${Math.min(r,100)}%;background:${ac(r||0)}"></div></div><div style="font-size:12px;color:var(--tx2)">${i.a25>0?'전년 '+pct(i.a25,i.t25)+'%':'-'}</div>`:''}</td></tr>`;
    });
    h+=`</tbody></table><div style="font-size:13.5px;font-weight:600;color:var(--tx2);margin-bottom:10px;padding-bottom:6px;border-bottom:1.5px solid var(--bd)">사업비 집행 현황</div>`;
    ['이월','연차'].forEach(btype=>{
      const bi=uB.filter(b=>b.btype===btype);if(!bi.length)return;
      const sa=bi.reduce((s,b)=>s+b.al,0),se=bi.reduce((s,b)=>s+b.ex,0),sr=pct(se,sa);
      const tc2=btype==='이월'?'#7c2d12':'#1e3a8a',tbg=btype==='이월'?'#fef3c7':'#dbeafe';
      h+=`<div style="font-size:13.5px;font-weight:700;color:${tc2};background:${tbg};padding:5px 11px;border-radius:6px;margin-bottom:7px;display:inline-block">${btype}사업비 · 집행률 ${sr}%</div>
      <table class="tbl" style="margin-bottom:12px"><thead><tr><th style="width:90px">비목</th><th>항목명</th><th style="text-align:right;width:88px">편성</th><th style="text-align:right;width:88px">집행</th><th style="text-align:right;width:88px">잔액</th><th style="width:55px">집행률</th><th style="width:110px">현황</th></tr></thead><tbody>`;
      bi.forEach(b=>{const r=pct(b.ex,b.al),cl=CC[b.cat]||'#4338ca';
        h+=`<tr><td><span style="font-size:13px;color:${cl};background:${cl}22;padding:3px 8px;border-radius:10px;white-space:nowrap">${b.cat}</span></td><td style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${b.name}</td><td style="text-align:right">${fmt(b.al)}</td><td style="text-align:right">${fmt(b.ex)}</td><td style="text-align:right;color:var(--tx2)">${fmt(b.al-b.ex)}</td><td><span style="font-size:14px;font-weight:700;color:${pc(r)}">${r}%</span></td><td><div class="mb"><div class="mbf" style="width:${r}%;background:${pc(r)}"></div></div></td></tr>`;
      });
      h+=`<tr style="background:${tbg}"><td colspan="2" style="font-size:14px;font-weight:700;color:${tc2}">소계</td><td style="text-align:right;font-size:14px;font-weight:700;color:${tc2}">${fmt(sa)}</td><td style="text-align:right;font-size:14px;font-weight:700;color:${tc2}">${fmt(se)}</td><td style="text-align:right;font-size:14px;font-weight:700;color:${tc2}">${fmt(sa-se)}</td><td colspan="2" style="font-size:14px;font-weight:700;color:${tc2}">${sr}%</td></tr></tbody></table>`;
    });
    h+=`</div></div>`;
  });
  document.getElementById('t-rpt').innerHTML=h;
}

// ── FILE ──
function hFiles(files){
  Array.from(files).forEach(f=>{
    if(f.size>5*1024*1024){toast(f.name+': 5MB 초과','e');return;}
    const rd=new FileReader();rd.onload=e=>{pFiles.push({name:f.name,size:f.size,type:f.type,data:e.target.result});rFL();};rd.readAsDataURL(f);
  });
}
function rFL(){
  const l=document.getElementById('FL');if(!l)return;
  l.innerHTML=pFiles.map((f,i)=>`<div class="fitem"><i class="ti ti-file" style="color:#1a6fc4;flex-shrink:0;font-size:18px"></i><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#1a6fc4">${f.name}</span><span style="font-size:12px;color:var(--tx3)">${fmtB(f.size)}</span><button class="ad" style="width:28px;height:28px;font-size:14px" onclick="pFiles.splice(${i},1);rFL()"><i class="ti ti-x"></i></button></div>`).join('');
}
function vFiles(id){
  const d=dokuments.find(x=>x.id===id);if(!d||!d.files||!d.files.length){toast('첨부 파일 없음');return;}
  d.files.forEach(f=>{const a=document.createElement('a');a.href=f.data;a.download=f.name;document.body.appendChild(a);a.click();document.body.removeChild(a);});
}

// ── OPENERS ──
function opT(id){
  eT=id||null;document.getElementById('MTT').textContent=id?'업무 수정':'업무 추가';
  if(id){const t=tasks.find(x=>x.id===id);if(t){
    document.getElementById('t_u').value=t.unit;document.getElementById('t_f').value=t.field;
    document.getElementById('t_ti').value=t.title;document.getElementById('t_w').value=t.who;
    document.getElementById('t_d').value=t.due;document.getElementById('t_s').value=t.stat;
    document.getElementById('t_tp').value=t.type||'일반행정';
    document.getElementById('t_dr').value=t.delayReason||'';
    togI();togD();if(t.type==='정량지표'){updI();setTimeout(()=>document.getElementById('t_i').value=t.iid||'',10);}
  }}else{
    ['t_ti','t_d','t_dr'].forEach(i=>document.getElementById(i).value='');
    document.getElementById('t_w').value=CU?.name||'';
    document.getElementById('t_s').value='예정';document.getElementById('t_tp').value='일반행정';
    document.getElementById('IW').style.display='none';document.getElementById('DW').style.display='none';
  }
  om('MT');
}
function togI(){const t=document.getElementById('t_tp').value;document.getElementById('IW').style.display=t==='정량지표'?'block':'none';if(t==='정량지표')updI();}
function togD(){const s=document.getElementById('t_s').value;document.getElementById('DW').style.display=s==='지연'?'block':'none';}
function updI(){const u=document.getElementById('t_u').value;const s=document.getElementById('t_i');s.innerHTML='<option value="">-- 선택 --</option>'+indicators.filter(i=>i.unit===u).map(i=>`<option value="${i.id}">${i.name} (${i.ul})</option>`).join('');}
function opI(id){if(!isAdmin()){toast('관리자 권한이 필요합니다','e');return;}eI=id;const i=indicators.find(x=>x.id===id);if(!i)return;document.getElementById('MIT').textContent=i.name+' 실적 입력';document.getElementById('MII').innerHTML=`<strong>${i.unit} · ${i.name}</strong><br>2025 실적: ${i.a25>0?fmt(i.a25)+' '+i.ul:'-'}`;document.getElementById('i_t').value=i.t26||'';document.getElementById('i_a').value=i.a26||'';om('MI');}
function opB(id){if(!isAdmin()){toast('관리자 권한이 필요합니다','e');return;}eB=id||null;document.getElementById('MBT').textContent=id?'예산 항목 수정':'예산 항목 추가';if(id){const b=budget.find(x=>x.id===id);if(b){document.getElementById('b_u').value=b.unit;document.getElementById('b_bt').value=b.btype;document.getElementById('b_c').value=b.cat;document.getElementById('b_n').value=b.name;document.getElementById('b_a').value=b.al;document.getElementById('b_e').value=b.ex;}}else{['b_n','b_a','b_e'].forEach(i=>document.getElementById(i).value='');}om('MB');}
function opD(id){eD=id||null;pFiles=[];document.getElementById('MDT').textContent=id?'기안 수정':'기안 추가';if(id){const d=dokuments.find(x=>x.id===id);if(d){document.getElementById('d_tp').value=d.dtype;document.getElementById('d_u').value=d.unit;document.getElementById('d_ti').value=d.title;document.getElementById('d_dt').value=d.date;document.getElementById('d_w').value=d.who;document.getElementById('d_s').value=d.stat;pFiles=d.files?[...d.files]:[];}}else{['d_ti','d_dt'].forEach(i=>document.getElementById(i).value='');document.getElementById('d_w').value=CU?.name||'';}rFL();om('MD');}
function opR(id){eR=id||null;document.getElementById('MRT').textContent=id?'보고서 수정':'보고서 추가';if(id){const r=reports.find(x=>x.id===id);if(r){document.getElementById('r_tp').value=r.rtype;document.getElementById('r_wk').value=r.wkKey||'';document.getElementById('r_ti').value=r.title;document.getElementById('r_d').value=r.due;document.getElementById('r_w').value=r.who;document.getElementById('r_s').value=r.stat;}}else{['r_ti','r_d','r_wk'].forEach(i=>document.getElementById(i).value='');document.getElementById('r_w').value=CU?.name||'';}om('MR');}
function opE(id){eE=id||null;document.getElementById('MET').textContent=id?'일정 수정':'일정 추가';if(id){const e=events.find(x=>x.id===id);if(e){document.getElementById('e_ti').value=e.title;document.getElementById('e_d').value=e.date;document.getElementById('e_u').value=e.unit;document.getElementById('e_et').value=e.etype;document.getElementById('e_w').value=e.who;document.getElementById('e_m').value=e.memo||'';}}else{['e_ti','e_d','e_m'].forEach(i=>document.getElementById(i).value='');document.getElementById('e_w').value=CU?.name||'';}om('ME');}
function opWK(unit,sec,id){eW=id||null;if(unit)document.getElementById('w_u').value=unit;if(sec)document.getElementById('w_s').value=sec;if(id&&unit&&sec){const key=gWK(wkO);const item=weeklyData[key]?.[unit]?.[sec]?.find(i=>i.id===id);if(item){document.getElementById('w_t').value=item.text;document.getElementById('w_w').value=item.who;document.getElementById('w_tp').value=item.type||'일반행정';}}else{document.getElementById('w_t').value='';document.getElementById('w_w').value=CU?.name||'';}om('MWK');}

// ── SAVERS ──
function svT(){
  const unit=document.getElementById('t_u').value,field=document.getElementById('t_f').value,title=document.getElementById('t_ti').value.trim(),who=document.getElementById('t_w').value.trim(),due=document.getElementById('t_d').value,stat=document.getElementById('t_s').value,type=document.getElementById('t_tp').value,iid=type==='정량지표'?document.getElementById('t_i').value:'',delayReason=stat==='지연'?document.getElementById('t_dr').value.trim():'';
  const prog=stat==='완료'?100:stat==='예정'?0:(eT?tasks.find(t=>t.id===eT)?.prog||0:0);
  if(!title||!who)return;
  if(eT){const idx=tasks.findIndex(t=>t.id===eT);if(idx>-1)tasks[idx]={...tasks[idx],unit,field,title,who,due,stat,prog,type,iid,delayReason};}
  else tasks.push({id:Date.now(),unit,field,title,who,ownerId:CU?.id||'admin',due,stat,prog,type,iid,delayReason});
  sv('tasks',tasks);cm('MT');rTask();toast('업무가 저장되었습니다');
}
function svI(){const idx=indicators.findIndex(i=>i.id===eI);if(idx>-1){indicators[idx].t26=parseFloat(document.getElementById('i_t').value)||0;indicators[idx].a26=parseFloat(document.getElementById('i_a').value)||0;}sv('indicators',indicators);cm('MI');rInd();toast('실적이 저장되었습니다');}
function svB(){const unit=document.getElementById('b_u').value,btype=document.getElementById('b_bt').value,cat=document.getElementById('b_c').value,name=document.getElementById('b_n').value.trim(),al=parseInt(document.getElementById('b_a').value)||0,ex=parseInt(document.getElementById('b_e').value)||0;if(!name)return;if(eB){const idx=budget.findIndex(b=>b.id===eB);if(idx>-1)budget[idx]={...budget[idx],unit,btype,cat,name,al,ex};}else budget.push({id:Date.now(),unit,btype,cat,name,al,ex});sv('budget',budget);cm('MB');rBud();toast('저장되었습니다');}
function svD(){const dtype=document.getElementById('d_tp').value,unit=document.getElementById('d_u').value,title=document.getElementById('d_ti').value.trim(),date=document.getElementById('d_dt').value,who=document.getElementById('d_w').value.trim(),stat=document.getElementById('d_s').value;if(!title)return;if(eD){const idx=dokuments.findIndex(d=>d.id===eD);if(idx>-1)dokuments[idx]={...dokuments[idx],dtype,unit,title,date,who,stat,files:[...pFiles]};}else dokuments.push({id:Date.now(),dtype,unit,title,date,who,ownerId:CU?.id||'admin',stat,files:[...pFiles]});sv('dokuments',dokuments);cm('MD');rPer();toast('기안이 저장되었습니다');}
function svR(){const rtype=document.getElementById('r_tp').value,wkKey=document.getElementById('r_wk').value.trim(),title=document.getElementById('r_ti').value.trim(),due=document.getElementById('r_d').value,who=document.getElementById('r_w').value.trim(),stat=document.getElementById('r_s').value;if(!title)return;if(eR){const idx=reports.findIndex(r=>r.id===eR);if(idx>-1)reports[idx]={...reports[idx],rtype,wkKey,title,due,who,stat};}else reports.push({id:Date.now(),rtype,wkKey,title,due,who,ownerId:CU?.id||'admin',stat});sv('reports',reports);cm('MR');rPer();toast('저장되었습니다');}
function svE(){const title=document.getElementById('e_ti').value.trim(),date=document.getElementById('e_d').value,unit=document.getElementById('e_u').value,etype=document.getElementById('e_et').value,who=document.getElementById('e_w').value.trim(),memo=document.getElementById('e_m').value.trim();if(!title||!date)return;if(eE){const idx=events.findIndex(e=>e.id===eE);if(idx>-1)events[idx]={...events[idx],title,date,unit,etype,who,memo};}else events.push({id:Date.now(),title,date,unit,etype,who,memo});sv('events',events);cm('ME');rSch();toast('일정이 저장되었습니다');}
function svWK(){const key=gWK(wkO);eWK(key);const unit=document.getElementById('w_u').value,sec=document.getElementById('w_s').value,text=document.getElementById('w_t').value.trim(),who=document.getElementById('w_w').value.trim(),type=document.getElementById('w_tp').value;if(!text)return;if(eW){const idx=weeklyData[key][unit][sec].findIndex(i=>i.id===eW);if(idx>-1)weeklyData[key][unit][sec][idx]={...weeklyData[key][unit][sec][idx],text,who,type};}else weeklyData[key][unit][sec].push({id:Date.now(),text,who,ownerId:CU?.id||'admin',type});sv('weeklyData',weeklyData);cm('MWK');rPer();toast('저장되었습니다');}

// ── DELETERS ──
function dlT(id){if(confirm('삭제하시겠습니까?')){tasks=tasks.filter(t=>t.id!==id);sv('tasks',tasks);rTask();}}
function dlB(id){if(!isAdmin()){toast('권한 없음','e');return;}if(confirm('삭제?')){budget=budget.filter(b=>b.id!==id);sv('budget',budget);rBud();}}
function dlD(id){if(confirm('삭제?')){dokuments=dokuments.filter(d=>d.id!==id);sv('dokuments',dokuments);rPer();}}
function dlR(id){if(confirm('삭제?')){reports=reports.filter(r=>r.id!==id);sv('reports',reports);rPer();}}
function dlE(id){if(confirm('삭제?')){events=events.filter(e=>e.id!==id);sv('events',events);rSch();}}
function dlWK(key,unit,sec,id){weeklyData[key][unit][sec]=weeklyData[key][unit][sec].filter(i=>i.id!==id);sv('weeklyData',weeklyData);rPer();}

// ── INIT ──
document.getElementById('DL').textContent=new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric'});
const sess=sessionStorage.getItem('a_s');
if(sess){try{const u=JSON.parse(sess);const latest=gU().find(x=>x.id===u.id);if(latest){CU=latest;document.getElementById('LS').style.display='none';document.getElementById('TB').style.display='flex';document.getElementById('APP').style.display='block';rUC();go('task');}}catch{}}
document.getElementById('LID').focus();
</script>
